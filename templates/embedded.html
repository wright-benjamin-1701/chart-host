<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        #chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="chart"></div>
    <script>
    // Fetch the visualization data and render it
    fetch('/api/viz/{{ viz_id }}')
        .then(response => response.json())
        .then(data => {
            // Extract Plotly data and layout
            const plotData = data.data || [];
            const layout = data.layout || {};
            const config = data.config || {responsive: true};

            // Ensure the chart fills the entire viewport
            if (!layout.autosize) {
                layout.autosize = true;
            }
            layout.margin = layout.margin || {l: 40, r: 40, t: 40, b: 40};

            // Render the chart
            Plotly.newPlot('chart', plotData, layout, config);
        })
        .catch(error => {
            console.error('Error loading visualization:', error);
            document.getElementById('chart').innerHTML =
                '<p style="padding: 20px; color: red;">Error loading visualization. Please check the console for details.</p>';
        });

    // Make the chart responsive to window resizing
    window.addEventListener('resize', () => {
        Plotly.Plots.resize('chart');
    });
    </script>
</body>
</html>
