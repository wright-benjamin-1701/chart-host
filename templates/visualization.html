{% extends "base.html" %}

{% block title %}{{ title }} - Chart Host{% endblock %}

{% block content %}
<div class="viz-container">
    <h2>{{ title }}</h2>
    {% if description %}
    <p class="viz-description">{{ description }}</p>
    {% endif %}

    <div class="embed-controls">
        <button onclick="copyEmbedLink()" class="embed-btn">📋 Copy Embed Link</button>
        <button onclick="copyEmbedCode()" class="embed-btn">📋 Copy Embed Code</button>
    </div>

    <div id="chart"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Get the embed URL
const embedUrl = window.location.origin + '/embed/{{ viz_id }}';

// Copy embed link to clipboard
function copyEmbedLink() {
    navigator.clipboard.writeText(embedUrl).then(() => {
        showNotification('Embed link copied to clipboard!');
    }).catch(err => {
        console.error('Failed to copy:', err);
        showNotification('Failed to copy link', true);
    });
}

// Copy embed code to clipboard
function copyEmbedCode() {
    const embedCode = `<iframe src="${embedUrl}" width="800" height="600" frameborder="0"></iframe>`;
    navigator.clipboard.writeText(embedCode).then(() => {
        showNotification('Embed code copied to clipboard!');
    }).catch(err => {
        console.error('Failed to copy:', err);
        showNotification('Failed to copy code', true);
    });
}

// Show notification
function showNotification(message, isError = false) {
    const notification = document.createElement('div');
    notification.className = 'notification' + (isError ? ' error' : '');
    notification.textContent = message;
    document.body.appendChild(notification);

    setTimeout(() => {
        notification.classList.add('show');
    }, 10);

    setTimeout(() => {
        notification.classList.remove('show');
        setTimeout(() => notification.remove(), 300);
    }, 2000);
}

// Fetch the visualization data and render it
fetch('/api/viz/{{ viz_id }}')
    .then(response => response.json())
    .then(data => {
        // Extract Plotly data and layout
        const plotData = data.data || [];
        const layout = data.layout || {};
        const config = data.config || {responsive: true};

        // Ensure the chart is responsive
        if (!layout.autosize) {
            layout.autosize = true;
        }

        // Render the chart
        Plotly.newPlot('chart', plotData, layout, config);
    })
    .catch(error => {
        console.error('Error loading visualization:', error);
        document.getElementById('chart').innerHTML =
            '<p class="error">Error loading visualization. Please check the console for details.</p>';
    });

// Make the chart responsive to window resizing
window.addEventListener('resize', () => {
    Plotly.Plots.resize('chart');
});
</script>
{% endblock %}
